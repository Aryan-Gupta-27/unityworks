<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}UnityWorks{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "components/icons.html" %}
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="flash-stack" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}" role="status">
        <span>{{ message }}</span>
        <button type="button" class="flash-close" aria-label="Dismiss">&times;</button>
      </div>
      {% endfor %}
    {% endwith %}
  </div>
  {% block shell %}{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
