{% extends "base.html" %}
{% block title %}Something went wrong · UnityWorks{% endblock %}
{% block body_class %}landing{% endblock %}
{% block shell %}
<main class="error-wrap">
  <div class="glass error-card">
    <img src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
    <p class="eyebrow">500</p>
    <h1>The workspace stumbled.</h1>
    <p>Try that again in a moment. Nothing you just did should have been half-saved.</p>
    <a class="btn btn-primary" href="{{ url_for('main.landing') }}">Return home</a>
  </div>
</main>
{% endblock %}
