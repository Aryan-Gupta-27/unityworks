{% extends "base.html" %}
{% block title %}Not allowed · UnityWorks{% endblock %}
{% block body_class %}landing{% endblock %}
{% block shell %}
<main class="error-wrap">
  <div class="glass error-card">
    <img src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
    <p class="eyebrow">403</p>
    <h1>You don't have access to that.</h1>
    <p>Owners, moderators, and administrators are checked on the server — not just in the menu.</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.landing') }}">Go back</a>
  </div>
</main>
{% endblock %}
